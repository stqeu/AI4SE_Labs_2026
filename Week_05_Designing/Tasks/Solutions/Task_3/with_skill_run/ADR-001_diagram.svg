<rect x="136" y="300" width="88" height="30" rx="6"/><rect x="136" y="338" width="88" height="30" rx="6"/><rect x="136" y="376" width="88" height="30" rx="6"/>
<rect x="258" y="300" width="88" height="30" rx="6"/><rect x="258" y="338" width="88" height="30" rx="6"/><rect x="258" y="376" width="88" height="30" rx="6"/>
<rect x="380" y="300" width="88" height="30" rx="6"/><rect x="380" y="338" width="88" height="30" rx="6"/><rect x="380" y="376" width="88" height="30" rx="6"/>
<rect x="502" y="300" width="88" height="30" rx="6"/><rect x="502" y="338" width="88" height="30" rx="6"/><rect x="502" y="376" width="88" height="30" rx="6"/>
<rect x="624" y="300" width="88" height="30" rx="6"/><rect x="624" y="338" width="88" height="30" rx="6"/><rect x="624" y="376" width="88" height="30" rx="6"/>
</g>
<g text-anchor="middle">
<text x="180" y="274" font-weight="600" fill="#1f1f1f">Accounts</text><text x="180" y="290" font-size="11.5" fill="#6b6b6b">A · 1–5, 17–24</text>
<text x="302" y="274" font-weight="600" fill="#1f1f1f">Catalogue</text><text x="302" y="290" font-size="11.5" fill="#6b6b6b">B · 6–8, 13</text>
<text x="424" y="274" font-weight="600" fill="#1f1f1f">Orders</text><text x="424" y="290" font-size="11.5" fill="#6b6b6b">C · 9–12, 40–41</text>
<text x="546" y="274" font-weight="600" fill="#1f1f1f">Inventory</text><text x="546" y="290" font-size="11.5" fill="#6b6b6b">D · 14–16</text>
<text x="668" y="274" font-weight="600" fill="#1f1f1f">Admin</text><text x="668" y="290" font-size="11.5" fill="#6b6b6b">E, F · 25–39</text>
</g>
<path d="M468 353H502" fill="none" stroke="#e5673b" stroke-width="2" marker-end="url(#c)"/>
<text x="485" y="442" text-anchor="middle" font-size="11.5" fill="#1f1f1f">Orders calls Inventory only through its service interface</text>
<text x="392" y="489" font-size="11.5" fill="#6b6b6b">SQL, one transaction per reservation</text>
<rect x="190" y="500" width="380" height="88" rx="8" fill="none" stroke="#b3b0a6" stroke-width="1.25"/>
<g text-anchor="middle" fill="#1f1f1f">
<text x="380" y="524" font-weight="600">Managed PostgreSQL (EU region)</text>
<text x="380" y="540">CHECK (qty ≥ 0) · NUMERIC(10,2) money</text>
<text x="380" y="556">foreign keys RESTRICT · soft delete</text>
<text x="380" y="572">sessions table, deleted on user ban</text>
</g>
<rect x="24" y="604" width="16" height="12" rx="2" fill="#e4edf9" stroke="#2f74d0" stroke-width="1.5"/>
<text x="48" y="614" font-size="11.5" fill="#6b6b6b">security layer the rationale depends on</text>
<rect x="300" y="604" width="16" height="12" rx="2" fill="none" stroke="#b3b0a6" stroke-width="1.25" stroke-dasharray="3 2"/>
<text x="324" y="614" font-size="11.5" fill="#6b6b6b">external service, not built by us</text>
<line x1="540" y1="610" x2="560" y2="610" stroke="#e5673b" stroke-width="2"/>
<text x="568" y="614" font-size="11.5" fill="#6b6b6b">cross-module call</text>
