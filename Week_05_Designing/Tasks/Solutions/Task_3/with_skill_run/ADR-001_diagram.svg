<text x="340" y="96" text-anchor="middle" fill="#1f1f1f">Client · Farm · Admin</text>
<rect x="540" y="52" width="196" height="56" rx="8" fill="none" stroke="#b3b0a6" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="638" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Google Maps</text>
<text x="638" y="96" text-anchor="middle" fill="#1f1f1f">plain link (story 13)</text>
<g fill="none" stroke="#b3b0a6" stroke-width="1.25">
<path d="M500 80H540" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M340 108V148" marker-end="url(#a)"/>
<path d="M380 468V500" marker-end="url(#a)"/>
</g>
<text x="352" y="133" font-size="11.5" fill="#6b6b6b">HTTPS · HttpOnly session cookie</text>
<!-- app container -->
<rect x="24" y="148" width="712" height="320" rx="8" fill="none" stroke="#b3b0a6" stroke-width="1.25"/>
<text x="40" y="172" font-weight="600" fill="#1f1f1f">Deployable app (one unit, one codebase)</text>
<rect x="40" y="184" width="680" height="52" rx="8" fill="#e4edf9" stroke="#2f74d0" stroke-width="2"/>
<text x="380" y="206" text-anchor="middle" font-weight="600" fill="#1f1f1f">Security layer: framework security module</text>
<text x="380" y="225" text-anchor="middle" font-size="11.5" fill="#1f1f1f">login · sessions stored in DB · CSRF · deny-by-default roles</text>
<g font-size="11.5" fill="#6b6b6b">
<text x="40" y="319">controller</text><text x="40" y="357">service</text><text x="40" y="395">repository</text>
</g>
<g fill="none" stroke="#b3b0a6">
<rect x="128" y="252" width="104" height="166" rx="8" stroke-width="1.25"/><rect x="250" y="252" width="104" height="166" rx="8" stroke-width="1.25"/><rect x="372" y="252" width="104" height="166" rx="8" stroke-width="1.25"/><rect x="494" y="252" width="104" height="166" rx="8" stroke-width="1.25"/><rect x="616" y="252" width="104" height="166" rx="8" stroke-width="1.25"/>
</g>
